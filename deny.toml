# cargo-deny configuration (RFC-0021 scan gate).
#
# Policy: vulnerabilities are FIXED in the lockfile (never ignored);
# only unmaintained/unsound WARNING-class advisories from transitive
# chains (tantivy/fastembed) sit in the ignore list, each with its cause.
# Licenses: permissive/OSI allow-list covering the Rust ecosystem.
# Bans: wildcard dependencies denied; duplicate versions warn.

[advisories]
version = 2
yanked = "warn"
# unmaintained/unsound crates surface as cargo-audit's warning baseline,
# not hard gate failures.
unmaintained = "workspace"
unsound = "workspace"
# Warning-baseline advisories — remove entries when the dependency chain
# updates past them:
ignore = [
    # hickory-proto 0.25.2 (via reqwest -> hickory-resolver ^0.25) — fixed in
    # 0.26.1; blocked by reqwest's pin. None reachable from exposed DNS surfaces.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # quick-xml 0.37.5 (via core/packs -> oxrdfio -> oxrdfxml ^0.37) — fixed
    # in 0.38; blocked by oxrdfxml's pin. Not reachable from exposed parsing.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # lru 0.12.5 (via tantivy ^0.12) — Stacked-Borrows + panic-safety in
    # IterMut/pop; unused code paths for our read-only caches.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]


[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "NCSA", # libfuzzer-sys rider (OSI-approved, via fastembed→image→ravif; build-only)
]
confidence-threshold = 0.93

# ring: "(MIT OR Apache-2.0) AND NCSA" — the NCSA rider covers its build
# files; clarify to the dual-licensed core (standard cargo-deny practice).
[[licenses.clarify]]
name = "ring"
expression = "MIT OR Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
