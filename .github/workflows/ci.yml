name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts
        run: scripts/ci/check-contracts.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    # PS3 (pgvector-backend): a live Postgres+pgvector service so the recipe's
    # Docker-gated conformance tests run in the gate. The fastembed-gated
    # vector-lane test stays local/Docker (CI has no model cache; the recipe
    # degrades without it by design).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: pgvector recipe conformance (live Postgres service)
        run: cargo test -p engram-backend-pgvector -- --ignored --test-threads=1
      - name: Engine-neutrality lint (ADR-0022 rule 1)
        run: scripts/ci/check-engine-neutrality.sh
      - name: Surface-parity lint (Rust facade <-> N-API binding)
        run: scripts/ci/check-surface-parity.sh
      - name: Check vector FastEmbed feature tests
        run: cargo check -p engram-store-vector --features fastembed-tests --tests
      - name: Clippy vector FastEmbed feature tests
        run: cargo clippy -p engram-store-vector --features fastembed-tests --tests -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check docs
        run: scripts/ci/check-docs.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate contracts
        run: pnpm run contracts:generate
      - name: Check generated contract drift
        run: git diff --exit-code -- packages/contracts/src/generated
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit
