[package]
name = "engram-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engram-domain = { path = "../../core/domain", version = "0.1.0" }
engram-runtime = { path = "../../core/runtime", version = "0.1.0" }
# Enable the `sqlite` backend so the port impls (`Sql*`) and `EngramProvider::open`
# are available to this crate's fixtures + wiring delegate. The engine-specific
# code lives in `core/integration/src/sqlite/`; this crate keeps the conformance
# harness + fixtures (test infrastructure).
engram-integration = { path = "../../core/integration", version = "0.1.0", features = ["sqlite"] }
engram-memory = { path = "../../core/memory", version = "0.1.0" }
engram-knowledge = { path = "../../core/knowledge", version = "0.1.0" }
engram-hierarchy = { path = "../../core/hierarchy", version = "0.1.0" }
engram-belief = { path = "../../core/belief", version = "0.1.0" }
engram-retrieval = { path = "../../core/retrieval", version = "0.1.0" }
engram-store-sqlite = { path = "../sqlite", version = "0.1.0" }
engram-reflection = { path = "../../core/reflection", version = "0.1.0" }
engram-store-lexical = { path = "../retrieval/tantivy-lexical", version = "0.1.0" }
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Enables the FastEmbed EmbeddingProvider wrapper + the FastEmbed-backed vector
# recall lane (pulls model-bearing code). Forwards to the core crate's feature
# of the same name, which brings in the vector store + its fastembed-provider.
fastembed = ["engram-integration/fastembed"]

[dev-dependencies]
tempfile = "3"
