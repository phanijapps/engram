# pgvector development instance for engram's Postgres backend (RFC-0017 Phase A).
# Start: docker compose -f docs/how-to-pg/docker-compose.yaml up -d
# Stop:  docker compose -f docs/how-to-pg/docker-compose.yaml down
# Connection string: postgres://engram:engram@localhost:5432/engram
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: engram-pgvector
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports:
      - "5432:5432"
    volumes:
      - engram-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  engram-pgvector-data:
