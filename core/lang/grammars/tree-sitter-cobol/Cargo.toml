[package]
name = "tree-sitter-cobol"
description = "COBOL grammar for the tree-sitter parsing library (vendored from yutaro-sakamoto/tree-sitter-cobol, MIT)"
version = "0.0.1"
edition = "2021"
license = "MIT"
build = "build.rs"
include = ["src/*", "build.rs", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
