name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Lightweight + fast: superseded runs on the same ref are cancelled instead of
# queueing behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts
        run: scripts/ci/check-contracts.sh

  changes:
    name: Path changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pgvector: ${{ steps.filter.outputs.pgvector }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pgvector:
              - 'adapters/pgvector/**'
              - 'backends/pgvector/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: cargo fmt --all --check
      # Clippy --all-targets compiles the whole workspace incl. tests, which
      # subsumes a separate `cargo check --workspace` pass.
      - name: Clippy (workspace + tests)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare owned acquisition transport fixtures
        run: python scripts/ci/prepare-acquisition-fixtures.py
      - name: Test
        run: cargo test --workspace
      - name: Engine-neutrality lint (ADR-0022 rule 1)
        run: scripts/ci/check-engine-neutrality.sh
      - name: Surface-parity lint (Rust facade <-> N-API binding)
        run: scripts/ci/check-surface-parity.sh
      # The fastembed-gated vector-lane checks are intentionally NOT run in
      # CI: they compile fastembed + ONNX for rarely-changing feature-gated
      # code. Keep them local (`cargo clippy -p engram-store-sqlite
      # --features fastembed-tests --tests`) when touching that module.

  pgvector:
    name: pgvector conformance (live Postgres)
    needs: changes
    if: needs.changes.outputs.pgvector == 'true'
    runs-on: ubuntu-latest
    # PS3 (pgvector-backend): a live Postgres+pgvector service so the recipe's
    # Docker-gated conformance tests run in the gate — but only when pgvector
    # paths actually change, instead of taxing every run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mark service database disposable (job-010 fixture contract)
        run: |
          docker exec $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) psql -U engram -d engram -c "COMMENT ON DATABASE engram IS 'engram.factory.job=010-project-bound-branch-indexing; disposable=true'"
        # NOTE: the marker marks the EPHEMERAL CI service disposable so the
        # branch's fail-closed fixture guards accept it; it is recreated per run.
      - name: pgvector recipe conformance (live Postgres service)
        run: cargo test -p engram-backend-pgvector -- --ignored --test-threads=1
        env:
          ENGRAM_TEST_PG_URL: postgres://engram:engram@localhost:5432/engram

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check docs
        run: scripts/ci/check-docs.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate contracts
        run: pnpm run contracts:generate
      - name: Check generated contract drift
        run: git diff --exit-code -- packages/contracts/src/generated
      - name: Build packages
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary — no cargo/rustup install or compile per run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
