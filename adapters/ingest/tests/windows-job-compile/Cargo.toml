[package]
name = "engram-windows-git-job-compile"
version = "0.0.0"
edition = "2024"
publish = false

# Isolate the platform primitive from unrelated native parser cross-toolchains.
# This checks compilation only; it is not Windows runtime acceptance evidence.
[workspace]

[target.'cfg(windows)'.dependencies]
engram-knowledge = { path = "../../../../core/knowledge" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp"] }

cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
