name: Release

# RFC-0021 Phase 4: tag-driven release pipeline.
#   1. Build matrix (native runners — no cross-compilation fragility)
#   2. Scan gate must have passed (security.yml on main)
#   3. Stamp platform npm tarballs + checksums + SBOM
#   4. GitHub Release with signed artifacts
#   5. npm publish with provenance (gated on dry_run input)
#
# Dry-run: workflow_dispatch with dry_run=true — everything runs except npm
# publish and release visibility (draft release). The first real release
# should always be a dry-run pass.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no npm publish, draft release)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}${{ matrix.variant == 'full' && ' (full)' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-latest
            variant: slim
          - target: linux-x64-gnu
            runner: ubuntu-latest
            variant: full
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            variant: slim
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            variant: full
          - target: darwin-arm64
            runner: macos-latest
            variant: slim
          - target: darwin-arm64
            runner: macos-latest
            variant: full
          - target: win32-x64
            runner: windows-latest
            variant: slim
          - target: win32-x64
            runner: windows-latest
            variant: full
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'linux-arm64-gnu' && 'aarch64-unknown-linux-gnu' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The tag rides the key: ENGRAM_BUILD_VERSION is compiled in, so a
          # cached binary from a previous tag must never be reused.
          key: ${{ matrix.target }}-${{ matrix.variant }}-${{ github.ref_name }}

      # Compile-time version stamp: the binary's self-reported version
      # (MCP serverInfo, status --json, future --version) reads
      # ENGRAM_BUILD_VERSION — the git tag, v-stripped to match npm semver.
      # Local builds fall back to the Cargo workspace version.
      - name: Set build version (git tag)
        run: echo "ENGRAM_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build (slim — no fastembed)
        if: matrix.variant == 'slim'
        run: cargo build --release -p engram-mcp --no-default-features --features http-embeddings

      - name: Build (full — fastembed)
        if: matrix.variant == 'full'
        run: cargo build --release -p engram-mcp

      - name: Stamp platform package
        shell: bash
        run: |
          BIN=target/release/engram-mcp
          [ "${{ matrix.target }}" = "win32-x64" ] && BIN=target/release/engram-mcp.exe
          python3 scripts/release/stamp-platform-package.py \
            "$BIN" \
            "${{ matrix.target }}" \
            "${{ env.VERSION }}" \
            ${{ matrix.variant == 'full' && '--full' || '' }}
          # emit checksum for the release manifest
          sha256sum "$BIN" > "$BIN.sha256"
          cp "$BIN.sha256" target/release/pkg/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.variant }}
          path: |
            target/release/pkg/*.tgz
            target/release/*.sha256

  launcher:
    name: Build launcher package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Pack launcher
        run: |
          cd packages/launcher
          # Remove private flag for publish
          node -e "
            const p = require('./package.json');
            const v = '${{ env.VERSION }}'.replace('v','');
            p.version = v;
            delete p.private;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = v;
            }
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm pack
          mkdir -p artifacts && mv *.tgz artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: packages/launcher/artifacts/*.tgz

  release:
    name: GitHub Release + npm publish
    needs: [build, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect checksums
        run: |
          echo "## Artifact checksums" > CHECKSUMS.md
          echo "" >> CHECKSUMS.md
          find artifacts -name "*.sha256" -exec cat {} \; >> CHECKSUMS.md
          find artifacts -name "*.tgz" -exec sha256sum {} \; >> CHECKSUMS.md

      - name: Detect pre-release + tag context
        id: prerelease
        run: |
          if [[ "${{ env.VERSION }}" =~ -(alpha|beta|rc|pre|dev) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=alpha" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi
          # workflow_dispatch from a branch has no tag — skip release creation
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "has_tag=true" >> $GITHUB_OUTPUT
          else
            echo "has_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.prerelease.outputs.has_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            artifacts/**/*.tgz
          body_path: CHECKSUMS.md
          generate_release_notes: true

      - name: Publish to npm (with provenance)
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: npm publish — launcher
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          cd packages/launcher
          node -e "
            const p = require('./package.json');
            const v = '${{ env.VERSION }}'.replace('v','');
            p.version = v;
            delete p.private;
            for (const k of Object.keys(p.optionalDependencies || {})) {
              p.optionalDependencies[k] = v;
            }
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          # Idempotent + retried publish (2026-10-20 silent drop): npm does
          # NOT retry publish POSTs — one dropped upload loses the version.
          # Skip when the version is already fetchable; retry otherwise.
          V="${GITHUB_REF_NAME#v}"
          if npm view "@engramlabs/mcp@$V" version >/dev/null 2>&1; then
            echo "launcher @engramlabs/mcp@$V already fetchable — skipping publish"
          else
            for attempt in 1 2 3; do
              if npm publish --provenance --access public --tag ${{ steps.prerelease.outputs.npm_tag }}; then
                break
              fi
              [ "$attempt" = 3 ] && { echo "::error::launcher publish failed after 3 attempts"; exit 1; }
              echo "retry $attempt failed — backing off"; sleep $((attempt * 20))
            done
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm publish — platform packages
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          # Idempotent + retried platform publishes (2026-10-20 silent drop:
          # mcp-darwin-arm64-full never became fetchable; npm does not retry
          # publish POSTs). Each tarball: skip when its version is already
          # fetchable (re-tag re-runs), else publish with backoff; a package
          # that still fails after 3 attempts fails the job loudly.
          find artifacts -name 'mcp-*.tgz' -type f | while read tgz; do
            meta=$(tar -xOf "$tgz" package/package.json)
            name=$(printf '%s' "$meta" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).name))")
            version=$(printf '%s' "$meta" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already fetchable — skipping"
              continue
            fi
            published=0
            for attempt in 1 2 3; do
              if npm publish "$tgz" --access public --tag ${{ steps.prerelease.outputs.npm_tag }}; then
                published=1; break
              fi
              echo "$name@$version attempt $attempt failed — backing off"
              sleep $((attempt * 20))
            done
            if [ "$published" != 1 ]; then
              echo "::error::$name@$version never published (3 attempts)"
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Registry verification (added after the 2026-10-19 silent drop:
      # npm echoed publish success + dist-tag success for
      # mcp-linux-x64-gnu@0.2.0-alpha and NONE of it landed — discovered
      # by users, not by us). Poll the registry until every package's
      # version is fetchable; fail the job loudly if any is missing.
      - name: Verify published versions exist on the registry
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          V="${{ env.VERSION }}"
          V="${V#v}"
          verify() {
            local pkg="$1" i
            for i in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' \
                    "https://registry.npmjs.org/@engramlabs%2f${pkg}/${V}")" = "200" ]; then
                echo "  ✓ @engramlabs/${pkg}@${V}"
                return 0
              fi
              sleep 20
            done
            echo "::error::@engramlabs/${pkg}@${V} never became fetchable (10 min) — npm dropped the publish. Re-tag to republish."
            return 1
          }
          FAIL=0
          verify mcp || FAIL=1
          for tgz in $(find artifacts -name 'mcp-*.tgz' -type f); do
            pkg=$(tar -xzOf "$tgz" package/package.json | node -e \
              "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).name.replace('@engramlabs/','')))")
            verify "$pkg" || FAIL=1
          done
          exit $FAIL
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keep `latest` pointing at the newest published version so the npm
      # landing page reflects the current release (the --tag publish above
      # only moves the channel tag, e.g. `alpha`; `latest` would drift).
      - name: npm dist-tag — sync latest
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          V="${{ env.VERSION }}"
          V="${V#v}"               # tag is v0.1.5-alpha; npm wants 0.1.5-alpha
          npm dist-tag add "@engramlabs/mcp@$V" latest
          for tgz in $(find artifacts -name 'mcp-*.tgz' -type f); do
            # Read the package name from the tarball's own manifest — robust
            # to filename shape (pre-0.1.8 tarballs carried a -v<version>
            # suffix, later ones don't).
            pkg=$(tar -xzOf "$tgz" package/package.json | node -e \
              "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).name))")
            npm dist-tag add "$pkg@$V" latest
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
