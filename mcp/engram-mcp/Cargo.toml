[package]
name = "engram-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "engram-mcp"
path = "src/main.rs"

[dependencies]
engram-domain = { path = "../../core/domain", version = "0.1.0" }
engram-ingest = { path = "../../adapters/ingest", version = "0.1.0" }
engram-integration = { path = "../../core/integration", version = "0.1.0", features = ["sqlite"] }
engram-knowledge = { path = "../../core/knowledge", version = "0.1.0" }
engram-retrieval = { path = "../../core/retrieval", version = "0.1.0" }
engram-belief = { path = "../../core/belief", version = "0.1.0" }
engram-hierarchy = { path = "../../core/hierarchy", version = "0.1.0" }
engram-codegraph-queries = { path = "../../codegraph/queries", version = "0.1.0" }
engram-codegraph-temporal = { path = "../../codegraph/temporal", version = "0.1.0" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
engram-backend-pgvector = { path = "../../backends/pgvector", optional = true }

[features]
http-embeddings = ["engram-integration/http-embeddings", "engram-backend-pgvector?/http-embeddings"]
# RFC-0019 D3 (reversed): the MCP ships vector (fastembed) ON by default so a
# fresh `cargo build -p engram-mcp` works out-of-the-box. Operators disable at
# runtime via `--no-vector` / `enable_vector = false` (skips model load) or at
# build time via `--no-default-features`.
default = ["fastembed", "http-embeddings"]
fastembed = ["engram-integration/fastembed"]
# Cross-encoder reranker (RFC-0019 T4). Forwards to the integration feature so
# an mcp build can opt into the cross-encoder dispatch path.
cross-encoder-rerank = ["engram-integration/cross-encoder-rerank"]
# Postgres/pgvector backend (pgvector-backend PS1). Wires `--backend pgvector`
# through the backends/pgvector recipe; SQLite stays the zero-dep default.
pgvector = ["dep:engram-backend-pgvector", "engram-backend-pgvector/fastembed"]

[dev-dependencies]
tempfile = "3"
