[package]
name = "engram-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
engram-lang = { path = "../../core/lang", version = "0.1.0" }
engram-code = { path = "../../core/code", version = "0.1.0" }
engram-domain = { path = "../../core/domain", version = "0.1.0" }
engram-knowledge = { path = "../../core/knowledge", version = "0.1.0" }
futures.workspace = true
ignore.workspace = true
libc = "0.2"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"
sha2.workspace = true
sha1collisiondetection = { version = "0.3.4", default-features = false, features = ["std"] }
flate2 = "1"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "hickory-dns"] }
url = "2.5.8"
tokio = { workspace = true, features = ["net", "time"] }

[dev-dependencies]
engram-store-sqlite = { path = "../sqlite", version = "0.1.0" }
futures.workspace = true
tempfile = "3"
rcgen = "=0.14.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp"] }
