[package]
name = "engram-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "engram-mcp"
path = "src/main.rs"

[dependencies]
engram-domain = { path = "../../core/domain" }
engram-ingest = { path = "../../adapters/ingest" }
engram-integration = { path = "../../core/integration", features = ["sqlite"] }
engram-knowledge = { path = "../../core/knowledge" }
engram-retrieval = { path = "../../core/retrieval" }
engram-belief = { path = "../../core/belief" }
engram-hierarchy = { path = "../../core/hierarchy" }
engram-codegraph-queries = { path = "../../codegraph/queries" }
engram-codegraph-temporal = { path = "../../codegraph/temporal" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# RFC-0019 D3 (reversed): the MCP ships vector (fastembed) ON by default so a
# fresh `cargo build -p engram-mcp` works out-of-the-box. Operators disable at
# runtime via `--no-vector` / `enable_vector = false` (skips model load) or at
# build time via `--no-default-features`.
default = ["fastembed"]
fastembed = ["engram-integration/fastembed"]
# Cross-encoder reranker (RFC-0019 T4). Forwards to the integration feature so
# an mcp build can opt into the cross-encoder dispatch path.
cross-encoder-rerank = ["engram-integration/cross-encoder-rerank"]

[dev-dependencies]
tempfile = "3"
