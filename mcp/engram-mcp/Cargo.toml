[package]
name = "engram-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "engram-mcp"
path = "src/main.rs"

[dependencies]
engram-domain = { path = "../../core/domain", version = "0.1.0" }
engram-ingest = { path = "../../adapters/ingest", version = "0.1.0" }
engram-integration = { path = "../../core/integration", version = "0.1.0", default-features = false, features = ["code-lanes"] }
engram-backend-provider = { path = "../../backends/provider", version = "0.1.0", default-features = false }
engram-runtime = { path = "../../core/runtime", version = "0.1.0" }
engram-memory = { path = "../../core/memory", version = "0.1.0" }
engram-knowledge = { path = "../../core/knowledge", version = "0.1.0" }
engram-retrieval = { path = "../../core/retrieval", version = "0.1.0" }
engram-belief = { path = "../../core/belief", version = "0.1.0" }
engram-hierarchy = { path = "../../core/hierarchy", version = "0.1.0" }
engram-codegraph-queries = { path = "../../codegraph/queries", version = "0.1.0" }
engram-packs = { path = "../../core/packs", version = "0.1.0" }
engram-codegraph-temporal = { path = "../../codegraph/temporal", version = "0.1.0" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
http-embeddings = ["engram-integration/http-embeddings", "engram-backend-provider/http-embeddings"]
# RFC-0019 D3 (reversed): the MCP ships vector (fastembed) ON by default so a
# fresh `cargo build -p engram-mcp` works out-of-the-box. Operators disable at
# runtime via `--no-vector` / `enable_vector = false` (skips model load) or at
# build time via `--no-default-features`.
default = ["sqlite", "fastembed", "http-embeddings"]
fastembed = ["engram-integration/fastembed", "engram-backend-provider/fastembed"]
# Cross-encoder reranker (RFC-0019 T4). Forwards to the integration feature so
# an mcp build can opt into the cross-encoder dispatch path.
cross-encoder-rerank = ["engram-integration/cross-encoder-rerank"]
# Postgres/pgvector backend (pgvector-backend PS1). Wires `--backend pgvector`
# through the backends/pgvector recipe; SQLite stays the zero-dep default.
sqlite = ["engram-backend-provider/sqlite"]
pgvector = ["engram-backend-provider/pgvector"]
helixdb-service = ["engram-backend-provider/helixdb-service"]
helixdb-embedded = ["engram-backend-provider/helixdb-embedded"]
helixdb = ["helixdb-service", "helixdb-embedded"]
# Explicit instrumented artifacts only; normal product features omit controls.
test-controls = ["engram-backend-provider/test-controls"]

[dev-dependencies]
engram-integration = { path = "../../core/integration", version = "0.1.0", default-features = false, features = ["sqlite"] }
tempfile = "3"
# Bound-code authority fixtures (r6 findings 2/4): the real SQLite binding
# cell + knowledge store drive in-process publication and scan-gate proofs.
engram-store-sqlite = { path = "../../adapters/sqlite", version = "0.1.0" }
