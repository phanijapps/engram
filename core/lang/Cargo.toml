[package]
name = "engram-lang"
version = "0.1.0"
edition = "2021"
description = "Language packs for the engram code chunker — modular tree-sitter grammars + declaration kind maps, registered at composition time."
license = "MIT"

[dependencies]
engram-code = { path = "../code" }
tree-sitter = "0.26"

tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-erlang = { version = "0.21", optional = true }
tree-sitter-ocaml = { version = "0.26", optional = true }
tree-sitter-haskell = { version = "0.24", optional = true }

[features]
default = ["lua", "julia", "zig", "dart", "erlang", "ocaml", "haskell"]
lua = ["dep:tree-sitter-lua"]
julia = ["dep:tree-sitter-julia"]
zig = ["dep:tree-sitter-zig"]
dart = ["dep:tree-sitter-dart"]
erlang = ["dep:tree-sitter-erlang"]
ocaml = ["dep:tree-sitter-ocaml"]
haskell = ["dep:tree-sitter-haskell"]

[dev-dependencies]
engram-domain = { path = "../domain" }
engram-knowledge = { path = "../knowledge" }
engram-ingest = { path = "../../adapters/ingest" }
engram-store-sqlite = { path = "../../adapters/sqlite" }
futures = "0.3"
