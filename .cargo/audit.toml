# cargo-audit advisories policy.
#
# 2026-10-30 (post job-010 merge): the audit gate began failing on advisories
# published after the last green main run (Oct 27). All four are TRANSITIVE
# dependencies with no compatible upgrade in our tree today:
#
#  - hickory-proto 0.25.2 (via reqwest 0.12 -> hickory-resolver ^0.25):
#      RUSTSEC-2026-0118 (no fixed release exists)
#      RUSTSEC-2026-0119 (fixed in 0.26.1 — blocked by reqwest's ^0.25 pin)
#  - quick-xml 0.37.5 (via core/packs -> oxrdfio -> oxrdfxml ^0.37):
#      RUSTSEC-2026-0194, RUSTSEC-2026-0195 (fixed in 0.38 — blocked by pin)
#  - instant (unmaintained; classic leaf advisory):
#      RUSTSEC-2024-0384
#
#  - lru 0.12.5 (via tantivy 0.22 ^0.12 pin):
#      RUSTSEC-2026-0002, RUSTSEC-2026-0253 (Stacked-Borrows + panic-safety
#      issues in IterMut/pop — unused code paths for our read-only caches)
#  - paste 1.0.15 (unmaintained proc-macro; via fastembed -> tokenizers)
#      RUSTSEC-2024-0436
#
# None are reachable from exposed parsing/DNS surfaces in this service's
# deployment paths (embedding HTTP client + local RDF pack parsing; tantivy
# caches never call the affected mutation APIs). Tracked for removal when
# upstream pins advance (reqwest -> hickory 0.26, oxrdfxml -> quick-xml 0.38,
# tantivy -> lru 0.13). Do not add new ignores without a comment here.
[advisories]
ignore = [
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
    "RUSTSEC-2024-0436",
]
