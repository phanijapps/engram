[package]
name = "engram-integration"
version = "0.1.0"
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[dependencies]
engram-code = { path = "../code", version = "0.1.0" }
engram-domain = { path = "../domain", version = "0.1.0" }
engram-runtime = { path = "../runtime", version = "0.1.0" }
engram-graph-analytics = { path = "../graph-analytics", version = "0.1.0" }
engram-memory = { path = "../memory", version = "0.1.0" }
engram-knowledge = { path = "../knowledge", version = "0.1.0" }
engram-hierarchy = { path = "../hierarchy", version = "0.1.0" }
engram-belief = { path = "../belief", version = "0.1.0" }
engram-procedures = { path = "../procedures", version = "0.1.0" }
engram-proposals = { path = "../proposals", version = "0.1.0" }
engram-retrieval = { path = "../retrieval", version = "0.1.0" }
engram-consolidation = { path = "../consolidation", version = "0.1.0" }
engram-reflection = { path = "../reflection", version = "0.1.0", optional = true }
engram-eval = { path = "../eval", version = "0.1.0", optional = true }
async-trait.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
toml.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

# SQLite backend (optional, behind the `sqlite` feature flag). These adapter
# crates depend only on the port trait crates (engram-memory, engram-knowledge,
# …), never on engram-integration, so the optional edge introduces no cycle.
# ADR-0022: the engine-specific code lives under src/sqlite/ and is intentionally
# exempt from the engine-neutrality gate.
engram-store-sqlite = { path = "../../adapters/sqlite", version = "0.1.0", optional = true }
engram-store-lexical = { path = "../../adapters/retrieval/tantivy-lexical", version = "0.1.0", optional = true }
engram-store-associative-graph = { path = "../../adapters/retrieval/associative-graph", version = "0.1.0", optional = true }
engram-store-community-summary = { path = "../../adapters/retrieval/community-summary", version = "0.1.0", optional = true }
engram-decay = { path = "../../adapters/consolidation/decay", version = "0.1.0", optional = true }
# Reranker adapters (RFC-0019 T3/T4). MMR is a tiny pure-Rust crate, available
# wherever sqlite recall runs (it degrades to relevance-only when no embedder
# is wired — e.g. fastembed off). The cross-encoder adapter is opt-in via its
# own feature; it carries no in-tree model, so construction is deferred to a
# deployer-provided `RerankScorer` (see backlog `cross-encoder-rerank`).
engram-rerank-mmr = { path = "../../adapters/retrieval/mmr-rerank", version = "0.1.0", optional = true }
engram-rerank-cross-encoder = { path = "../../adapters/retrieval/cross-encoder-rerank", version = "0.1.0", optional = true }
engram-ingest = { path = "../../adapters/ingest", version = "0.1.0", optional = true }
# Non-optional: the `hierarchy_build` facade (Louvain cluster→persist, shared by
# the stdio MCP + N-API binding) stamps `Utc::now()` on built nodes/relations,
# and `provenance.rs`/`provider.rs` already reference `chrono::Utc` in tests/base.
# It is a transitive dep via `engram-domain` (`Timestamp = DateTime<Utc>`); making
# it direct lets the non-sqlite base build the hierarchy facade. Not an engine.
chrono.workspace = true
futures = { workspace = true, optional = true }

engram-embedding-http = { path = "../../adapters/embedding/http", version = "0.1.0", optional = true }

[dev-dependencies]
tempfile = "3"
chrono.workspace = true
# `futures` is a TEST-ONLY dependency here: the S7 stub-backend conformance
# proof (tests/stub_backend.rs) drives async MemoryService trait methods
# synchronously via `futures::executor::block_on`. It never enters the library
# surface or any production adapter. Notably, this crate does NOT depend on
# `engram-store-sql` — that absence is the compile-time half of the ADR-0022
# backend-parametric proof (see tests/stub_backend.rs).
futures.workspace = true

[features]
default = []
# Code-authority lanes (review r6 findings 2/5): the shared registered-locator
# refresh + bound-generation ingestion pipeline live on the coordinator and
# need `engram-ingest`'s git acquisition + generation staging. Every shipped
# surface enables it (sqlite recipes via the `sqlite` feature below; the
# pgvector recipe enables it explicitly); the gate only keeps bare
# dependency-only builds of this crate honest.
code-lanes = ["dep:engram-ingest"]
# Optional FastEmbed-backed SQLite vector query provider. Implies `sqlite` (to
# bring in the vector store) and forwards to that crate's fastembed-provider
# feature.
fastembed = ["sqlite", "engram-store-sqlite/fastembed"]
ollama = ["dep:reqwest"]
http-embeddings = ["dep:engram-embedding-http"]
# The SQLite backend: constructs every file-backed store + the Sql* port impls
# under src/sqlite/, and makes EngramProvider::open return a wired provider.
sqlite = [
    "dep:engram-store-sqlite",
    "dep:engram-store-lexical",
    "dep:engram-store-associative-graph",
    "dep:engram-store-community-summary",
    "dep:engram-reflection",
    "dep:engram-eval",
    "dep:engram-decay",
    "dep:engram-rerank-mmr",
    "dep:engram-ingest",
    "dep:futures",
    "code-lanes",
]
# Cross-encoder reranker adapter (RFC-0019 T4 / D2.1c). Opt-in: the adapter is
# constructible when a deployer wires a `RerankScorer`; no in-tree model ships
# today (see backlog `cross-encoder-rerank`). Without this feature, selecting
# `rerank.strategy = "cross_encoder"` logs a warning and falls back to no
# rerank.
cross-encoder-rerank = ["dep:engram-rerank-cross-encoder"]
