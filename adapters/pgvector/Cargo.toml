[package]
name = "engram-store-pgvector"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
engram-domain = { path = "../../core/domain", version = "0.1.0" }
engram-runtime = { path = "../../core/runtime", version = "0.1.0" }
engram-memory = { path = "../../core/memory", version = "0.1.0" }
engram-knowledge = { path = "../../core/knowledge", version = "0.1.0" }
engram-belief = { path = "../../core/belief", version = "0.1.0" }
engram-hierarchy = { path = "../../core/hierarchy", version = "0.1.0" }
engram-procedures = { path = "../../core/procedures", version = "0.1.0" }
engram-retrieval = { path = "../../core/retrieval", version = "0.1.0" }
engram-consolidation = { path = "../../core/consolidation", version = "0.1.0" }
tokio = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
engram-integration = { path = "../../core/integration", version = "0.1.0", default-features = false }
