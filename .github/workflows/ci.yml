name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      native_preflight:
        description: "Run real native child custody and denied connect/DNS readiness controls ONLY"
        type: boolean
        default: false
      helix_e2e:
        description: "Execute the real Helix native matrix; missing prerequisites fail BLOCKED"
        type: boolean
        default: false
      provider_run_id:
        description: "Actual producer workflow run ID for the immutable artifact collection"
        type: string
      provider_artifact_ids:
        description: "Actual immutable artifact IDs (comma-separated); no inferred artifact names"
        type: string
      provider_manifest:
        description: "Path inside that collection to artifacts.json; {mode}/{target} placeholders allowed"
        type: string
      expected_record_run_id:
        description: "Actual run delivering the separately pinned build record"
        type: string
      expected_record_artifact_id:
        description: "Actual immutable build-record artifact ID, separate from provider bundles"
        type: string
      expected_record_path:
        description: "Relative build-record path inside its separate artifact"
        type: string
      expected_record_sha256:
        description: "Independent trusted orchestration pin, never taken from artifacts.json"
        type: string
      provider_phase:
        description: "Faults require a separate actual instrumented artifact and owned controls"
        type: choice
        options: [operations, faults, all]
        default: operations

# Lightweight + fast: superseded runs on the same ref are cancelled instead of
# queueing behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts
        run: tools/ci/check_contracts.py
      - name: Constitution gate (L1 + zero-deviation + registries)
        run: tools/ci/check_constitution.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate authored Engram skills for distribution checks
        run: node packages/launcher/scripts/generate-skills-payload.cjs
      - name: "Rule-class gates (L2: RULE-1/2/3/6)"
        run: |
          python3 tools/ci/check_implementation_registry.py
          python3 tools/ci/check_coherent_integration.py
          python3 tools/ci/check_production_completeness.py
          python3 tools/ci/check_distribution_drift.py
          python3 tools/ci/check_canonical_evidence.py
      - name: SDD artifact gate (advisory until 2026-11-28, DW-5)
        run: tools/ci/check_job_artifacts.py
        continue-on-error: true

  changes:
    name: Path changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pgvector: ${{ steps.filter.outputs.pgvector }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pgvector:
              - 'adapters/pgvector/**'
              - 'backends/pgvector/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: cargo fmt --all --check
      # Clippy --all-targets compiles the whole workspace incl. tests, which
      # subsumes a separate `cargo check --workspace` pass.
      - name: Clippy (workspace + tests)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare owned acquisition transport fixtures
        run: python tools/ci/prepare_acquisition_fixtures.py
      - name: Test
        run: cargo test --workspace
      - name: Engine-neutrality lint (ADR-0022 rule 1)
        run: tools/ci/check_engine_neutrality.py
      - name: Surface-parity lint (Rust facade <-> N-API binding)
        run: tools/ci/check_surface_parity.py
      # The fastembed-gated vector-lane checks are intentionally NOT run in
      # CI: they compile fastembed + ONNX for rarely-changing feature-gated
      # code. Keep them local (`cargo clippy -p engram-store-sqlite
      # --features fastembed-tests --tests`) when touching that module.

  pgvector:
    name: pgvector conformance (live Postgres)
    needs: changes
    if: needs.changes.outputs.pgvector == 'true'
    runs-on: ubuntu-latest
    # PS3 (pgvector-backend): a live Postgres+pgvector service so the recipe's
    # Docker-gated conformance tests run in the gate — but only when pgvector
    # paths actually change, instead of taxing every run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mark service database disposable (job-010 fixture contract)
        run: |
          docker exec $(docker ps -q --filter ancestor=pgvector/pgvector:pg17) psql -U engram -d engram -c "COMMENT ON DATABASE engram IS 'engram.factory.job=010-project-bound-branch-indexing; disposable=true'"
        # NOTE: the marker marks the EPHEMERAL CI service disposable so the
        # branch's fail-closed fixture guards accept it; it is recreated per run.
      - name: pgvector recipe conformance (live Postgres service)
        run: cargo test -p engram-backend-pgvector -- --ignored --test-threads=1
        env:
          ENGRAM_TEST_PG_URL: postgres://engram:engram@localhost:5432/engram

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check docs
        run: tools/ci/check_docs.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fresh invocation-owned temporary paths
        shell: bash
        run: |
          python3 - <<'PY_TEMP'
          import json, os, tempfile
          from pathlib import Path
          parent=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root=Path(tempfile.mkdtemp(prefix='engram-typescript-',dir=parent))
          values={'TMPDIR':str(root),'TEMP':str(root),'TMP':str(root)}
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('invalid native temporary path')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              for name,value in values.items():stream.write(name+'='+value+'\n')
          print(json.dumps({'owned_temporary_paths':values}))
          PY_TEMP
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate contracts
        run: pnpm run contracts:generate
      - name: Check generated contract drift
        run: git diff --exit-code -- packages/contracts/src/generated
      - name: Build packages
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test ordinary package and Node unit suites
        # Real multi-provider construction and fault cases belong to the
        # explicit native fixture lane below. The accepted -t outcome_unknown
        # command still registers actual cases and fails without its manifest.
        run: |
          pnpm --filter '!@engram/node' -r --if-present test
          node packages/node/test/helpers/build-native-recipes.mjs --providers sqlite,pgvector
          pnpm --filter @engram/node exec vitest run --exclude test/provider-selection.test.ts --exclude test/helixdb-provider.test.ts

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary — no cargo/rustup install or compile per run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit


  provider-controls:
    name: Provider inventory and omission controls (not workflow execution)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare fresh invocation-owned temporary paths
        shell: bash
        run: |
          python - <<'PY_TEMP'
          import json, os, tempfile
          from pathlib import Path
          parent=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root=Path(tempfile.mkdtemp(prefix='engram-provider-controls-',dir=parent))
          values={'TMPDIR':str(root),'TEMP':str(root),'TMP':str(root)}
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('invalid native temporary path')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              for name,value in values.items():stream.write(name+'='+value+'\n')
          print(json.dumps({'owned_temporary_paths':values}))
          PY_TEMP
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure inventory and negative harness controls
        run: |
          python3 -m unittest tools.ci.tests.test_provider_e2e_controls tools.ci.tests.test_bound_code_matrix_controls tools.ci.tests.test_provider_builds
          python3 tools/ci/run_provider_e2e.py --check-inventory --self-test-omissions
      - name: Pure operation and host-applicability contracts
        run: cargo +1.88.0 test -p engram-conformance --no-default-features --test provider_contracts

  helix-provider-e2e:
    # This opt-in workflow is not inventory PASS or automatic release approval.
    # Existing SQLite/PG compatibility jobs above remain unchanged.
    name: Helix ${{ matrix.mode }} / ${{ matrix.target }} actual native workflow
    if: github.event_name == 'workflow_dispatch' && inputs.helix_e2e
    needs: [contract, provider-controls]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        mode: [service, embedded]
        include:
          - target: linux-x64-gnu
            runner: ubuntu-latest
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
        target: [linux-x64-gnu, linux-arm64-gnu, darwin-arm64, win32-x64]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PROVIDER_TARGET: ${{ matrix.target }}
      PROVIDER_MODE: ${{ matrix.mode }}
      PROVIDER_PHASE: ${{ inputs.provider_phase }}
      PROVIDER_RUN_ID: ${{ inputs.provider_run_id }}
      PROVIDER_ARTIFACT_IDS: ${{ inputs.provider_artifact_ids }}
      PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
      EXPECTED_RECORD_RUN_ID: ${{ inputs.expected_record_run_id }}
      EXPECTED_RECORD_ARTIFACT_ID: ${{ inputs.expected_record_artifact_id }}
      EXPECTED_RECORD_PATH: ${{ inputs.expected_record_path }}
      EXPECTED_RECORD_SHA256: ${{ inputs.expected_record_sha256 }}
      PROVIDER_INPUT_ROOT: ${{ github.workspace }}/runs/ci-provider-inputs/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}/${{ matrix.mode }}
      PROVIDER_OUTPUT: runs/ci-provider-e2e/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}/${{ matrix.mode }}
      PROVIDER_SERVICE_ROOT: runs/ci-provider-server/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare fresh invocation-owned temporary paths
        shell: bash
        run: |
          python - <<'PY_TEMP'
          import json, os, tempfile
          from pathlib import Path
          parent=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root=Path(tempfile.mkdtemp(prefix='engram-provider-',dir=parent))
          values={'TMPDIR':str(root),'TEMP':str(root),'TMP':str(root),'EXPECTED_RECORD_ROOT':str(root/'expected-build-record')}
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('invalid native temporary path')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              for name,value in values.items():stream.write(name+'='+value+'\n')
          print(json.dumps({'owned_temporary_paths':values}))
          PY_TEMP
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install named standalone-server toolchain
        if: matrix.mode == 'service'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify pinned Node and pnpm prerequisites
        run: |
          node --version
          test "$(corepack pnpm --version)" = "10.0.0"
      - name: Verify explicit artifact delivery and actual native target
        run: |
          mkdir -p "$TMPDIR"
          python - <<'PY_CHECK'
          import os, platform, re
          target = {('Linux','x86_64'):'linux-x64-gnu', ('Linux','aarch64'):'linux-arm64-gnu',
                    ('Darwin','arm64'):'darwin-arm64', ('Windows','AMD64'):'win32-x64'}.get((platform.system(),platform.machine()))
          if target != os.environ['PROVIDER_TARGET']:
              raise SystemExit('BLOCKED: runner is not the declared native target')
          if not re.fullmatch(r'[0-9]+', os.environ['PROVIDER_RUN_ID']) or not re.fullmatch(r'[0-9]+(,[0-9]+)*', os.environ['PROVIDER_ARTIFACT_IDS']) or not os.environ['PROVIDER_MANIFEST']:
              raise SystemExit('BLOCKED: real producer run/artifact IDs and manifest path are required')
          if not re.fullmatch(r'[0-9]+',os.environ['EXPECTED_RECORD_RUN_ID']) or not re.fullmatch(r'[0-9]+',os.environ['EXPECTED_RECORD_ARTIFACT_ID']) or not re.fullmatch(r'[a-f0-9]{64}',os.environ['EXPECTED_RECORD_SHA256']) or not os.environ['EXPECTED_RECORD_PATH']:
              raise SystemExit('BLOCKED: independent build-record delivery and SHA256 pin required')
          if os.environ['EXPECTED_RECORD_ARTIFACT_ID'] in os.environ['PROVIDER_ARTIFACT_IDS'].split(','):
              raise SystemExit('BLOCKED: expected build record must be delivered separately')
          PY_CHECK
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.provider_artifact_ids }}
          run-id: ${{ inputs.provider_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.PROVIDER_INPUT_ROOT }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.expected_record_artifact_id }}
          run-id: ${{ inputs.expected_record_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.EXPECTED_RECORD_ROOT }}
          merge-multiple: true
      - name: Resolve real deliveries and independently pinned build record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY_INPUT'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          root = Path(os.environ['PROVIDER_INPUT_ROOT']).resolve()
          def confined(value, base=root):
              path = Path(value)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('BLOCKED: delivered paths must be confined relative paths')
              candidate = base / path
              if candidate.is_symlink() or not candidate.is_file():
                  raise SystemExit('BLOCKED: missing or symlinked artifact/plan')
              resolved = candidate.resolve()
              if not resolved.is_relative_to(base):
                  raise SystemExit('BLOCKED: artifact/plan escapes the delivered collection')
              return resolved
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def checked(value, expected):
              path = confined(value)
              if not isinstance(expected,str) or sha(path) != expected:
                  raise SystemExit('BLOCKED: delivered bytes do not match original immutable hash')
              return str(path)
          def required_profiles(phase):
              return {'operations': [False], 'faults': [True], 'all': [False, True]}[phase]
          def selected_profiles(rows, host, mode, target, phase):
              selected = []
              for instrumented in required_profiles(phase):
                  matches = [r for r in rows if r.get('host') == host and r.get('mode') == mode and r.get('target') == target and r.get('instrumented') is instrumented]
                  if len(matches) != 1:
                      raise SystemExit('BLOCKED: exactly one artifact per required host/mode/target/profile required')
                  selected.extend(matches)
              return selected
          source = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          record_path = confined(os.environ['EXPECTED_RECORD_PATH'],Path(os.environ['EXPECTED_RECORD_ROOT']).resolve())
          from tools.ci.run_provider_e2e import HOSTS, load_expected_build_record, validate_artifact
          trusted = load_expected_build_record(record_path,os.environ['EXPECTED_RECORD_SHA256'],root)
          def github(path):
              request = urllib.request.Request(os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          def verify_delivery(run_id, artifact_ids):
              run = github('/actions/runs/'+run_id)
              if run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('head_sha') != source or run.get('repository',{}).get('full_name') != os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit('BLOCKED: delivery repository/commit does not match checkout')
              for artifact_id in artifact_ids:
                  artifact = github('/actions/artifacts/'+artifact_id)
                  if artifact.get('expired') is not False or str(artifact.get('workflow_run',{}).get('id')) != run_id or artifact.get('workflow_run',{}).get('head_sha') != source:
                      raise SystemExit('BLOCKED: immutable artifact does not belong to expected run/commit')
          verify_delivery(os.environ['PROVIDER_RUN_ID'],os.environ['PROVIDER_ARTIFACT_IDS'].split(','))
          verify_delivery(os.environ['EXPECTED_RECORD_RUN_ID'],[os.environ['EXPECTED_RECORD_ARTIFACT_ID']])
          producer = trusted['producer']
          if producer.get('repository') != os.environ['GITHUB_REPOSITORY'] or str(producer.get('run_id')) != os.environ['PROVIDER_RUN_ID'] or producer.get('commit') != source:
              raise SystemExit('BLOCKED: independent producer identity does not match actual delivery')
          name = os.environ['PROVIDER_MANIFEST'].replace('{mode}',os.environ['PROVIDER_MODE']).replace('{target}',os.environ['PROVIDER_TARGET'])
          manifest = json.loads(confined(name).read_text())
          if manifest.get('schema') != 'engram.provider-artifacts.v1' or not manifest.get('artifacts'):
              raise SystemExit('BLOCKED: actual producer artifact manifest required')
          selected = []
          for host in HOSTS:
              selected.extend(selected_profiles(manifest['artifacts'],host,os.environ['PROVIDER_MODE'],os.environ['PROVIDER_TARGET'],os.environ['PROVIDER_PHASE']))
          for row in manifest['artifacts']:
              # Verify original bytes before relocation; never rewrite plan templates.
              row['path'] = checked(row['path'],row.get('sha256'))
              for field in ('compiler_record','link_record'):
                  row[field] = checked(row[field],row.get(field+'_sha256'))
              if row.get('request_plan') is not None:
                  row['request_plan'] = checked(row['request_plan'],row.get('request_plan_sha256'))
              plans = row.get('fault_plans',{})
              hashes = row.get('fault_plan_sha256',{})
              if not isinstance(plans,dict) or set(plans) != set(hashes):
                  raise SystemExit('BLOCKED: every fault template requires its original hash')
              row['fault_plans'] = {scenario:checked(path,hashes[scenario]) for scenario,path in plans.items()}
          for row in selected:
              validate_artifact(row,host=row['host'],mode=os.environ['PROVIDER_MODE'],target=os.environ['PROVIDER_TARGET'],source=source,lock=sha(Path('Cargo.lock')),trusted=trusted,bundle_root=root)
          manifest['artifacts'] = selected
          output = root / 'consumed-artifacts.json'
          with output.open('x') as stream:
              json.dump(manifest,stream)
          PY_INPUT
      - name: Run selected Helix native consumers with owned service cleanup
        run: |
          python - <<'PY_RUN'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          command = [sys.executable,'tools/ci/run_provider_e2e.py','--provider','helixdb',
                     '--mode',os.environ['PROVIDER_MODE'],'--target',os.environ['PROVIDER_TARGET'],
                     '--phase',os.environ['PROVIDER_PHASE'],'--artifacts',str(Path(os.environ['PROVIDER_INPUT_ROOT'])/'consumed-artifacts.json'),
                     '--output',os.environ['PROVIDER_OUTPUT'],
                     '--expected-build-record',str(Path(os.environ['EXPECTED_RECORD_ROOT'])/os.environ['EXPECTED_RECORD_PATH']),
                     '--expected-build-record-sha256',os.environ['EXPECTED_RECORD_SHA256']]
          service = os.environ['PROVIDER_MODE'] == 'service'
          fixture = Path(os.environ['PROVIDER_SERVICE_ROOT'])
          code = 2
          try:
              if service:
                  if platform.system() != 'Linux':
                      print('BLOCKED: equivalent native service ownership/control backend is unavailable',file=sys.stderr)
                      raise RuntimeError('BLOCKED: equivalent native service ownership/control backend is unavailable')
                  provision = subprocess.run(['/usr/bin/python3','tools/ci/helixdb_server.py','provision','--output',str(fixture)],capture_output=True,text=True)
                  if provision.returncode:
                      raise RuntimeError('BLOCKED: owned service provision failed; retained fixture output requires inspection')
                  state = json.loads((fixture/'state.json').read_text())
                  os.environ['HELIX_TEST_ENDPOINT'] = state['endpoint']
                  os.environ['HELIX_TEST_CREDENTIAL_ENV'] = state['credential_env']
                  os.environ[state['credential_env']] = (fixture/'credential.secret').read_text().strip()
                  os.environ['HELIX_TEST_CONTROL_DIR'] = str(fixture.resolve())
              # The runner verifies source/lock/hash/features/profile/target, actual
              # host operations and native ownership. Missing traces are BLOCKED;
              # neither runner labels nor cross-compilation establish execution.
              code = subprocess.run(command).returncode
          except Exception:
              print('BLOCKED: native fixture prerequisite or owned execution failed; no retry or replay',file=sys.stderr)
          finally:
              if service and (fixture/'state.json').is_file() and not any(Path(os.environ['PROVIDER_OUTPUT']).glob('*/pending-process.json')):
                  cleanup = subprocess.run(['/usr/bin/python3','tools/ci/helixdb_server.py','cleanup','--output',str(fixture)])
                  if cleanup.returncode:
                      print('BLOCKED: cleanup uncertainty; retain exact identity and data',file=sys.stderr)
                      code = 2
          raise SystemExit(code)
          PY_RUN
      - name: Verify actual invocation compact output completeness
        if: always()
        run: |
          python - <<'PY_OUTPUT'
          import os, uuid
          from pathlib import Path
          root = Path(os.environ['PROVIDER_OUTPUT'])
          invocations = list(root.iterdir()) if root.is_dir() else []
          if not invocations:
              raise SystemExit('BLOCKED: no actual invocation reports produced')
          for directory in invocations:
              try:
                  canonical = str(uuid.UUID(directory.name)) == directory.name
              except ValueError:
                  canonical = False
              if not canonical or directory.is_symlink() or not directory.is_dir():
                  raise SystemExit('BLOCKED: unexpected invocation output path')
              for name in ('report.json','operations.jsonl','raw.log'):
                  path = directory / name
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit('BLOCKED: required compact invocation output missing')
          PY_OUTPUT
      - name: Retain compact actual reports (never credential files or request payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-${{ matrix.target }}-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.PROVIDER_OUTPUT }}/*/report.json
            ${{ env.PROVIDER_OUTPUT }}/*/operations.jsonl
            ${{ env.PROVIDER_OUTPUT }}/*/raw.log

  native-policy-readiness:
    if: (github.event_name == 'workflow_dispatch' && inputs.native_preflight) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'engram-native-preflight'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64-gnu, runner: ubuntu-24.04}
          - {target: linux-arm64-gnu, runner: ubuntu-24.04-arm}
          - {target: darwin-arm64, runner: macos-15}
          - {target: win32-x64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NATIVE_TARGET: ${{ matrix.target }}
      NATIVE_OUTPUT: runs/network/native-preflight/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: owned_paths
        name: Prepare fresh invocation-owned temporary paths
        shell: bash
        run: |
          python - <<'PY_TEMP'
          import json, os, tempfile
          from pathlib import Path
          parent=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root=Path(tempfile.mkdtemp(prefix='engram-native-',dir=parent))
          values={'TMPDIR':str(root),'TEMP':str(root),'TMP':str(root),'NATIVE_COMPACT_OUTPUT':str(root/'compact')}
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('invalid native temporary path')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              for name,value in values.items():stream.write(name+'='+value+'\n')
          print(json.dumps({'owned_temporary_paths':values}))
          PY_TEMP
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Record actual native environment and source
        run: |
          mkdir -p "$TMPDIR"
          python - <<'PY_NATIVE_ENV'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          from tools.ci.provider_network_trace import native_target
          if native_target()!=os.environ['NATIVE_TARGET']:
              raise SystemExit('BLOCKED: actual runner architecture/OS differs')
          print(json.dumps({'source_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'os':platform.system(),'machine':platform.machine(),'target':native_target(),'python':sys.executable,'python_version':sys.version,'TMPDIR':os.environ['TMPDIR'],'node':subprocess.check_output(['node','--version'],text=True).strip(),'rust':subprocess.check_output(['rustc','+1.88.0','--version'],text=True).strip(),'proof_kind':'controlled native custody/denied attempts ONLY; no Helix/addon/model/store'}))
          PY_NATIVE_ENV
      - name: Real native custody and denied network/DNS positive controls
        run: |
          PYTHON_NATIVE="$(python -c 'import sys;print(sys.executable)')"
          if [ "${{ runner.os }}" = "Linux" ]; then
            /usr/bin/python3 tools/ci/check_storage_network_policy.py --native-preflight --acquisition-scope github-hosted-disposable-readiness --target "$NATIVE_TARGET" --output "$NATIVE_OUTPUT"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # The first elevated process and its original children exit before a
            # separate exporter hands only three compact files to this runner.
            mkdir -m 700 "$NATIVE_COMPACT_OUTPUT"
            set +e
            sudo -n env TMPDIR="$TMPDIR" TEMP="$TEMP" TMP="$TMP" CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" RUNNER_NAME="$RUNNER_NAME" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" "$PYTHON_NATIVE" tools/ci/check_storage_network_policy.py --native-preflight --acquisition-scope github-hosted-disposable-readiness --target "$NATIVE_TARGET" --output "$NATIVE_OUTPUT" > "$TMPDIR/native-result.json"
            PREFLIGHT_STATUS=$?
            set -e
            cat "$TMPDIR/native-result.json"
            NATIVE_INVOCATION="$("$PYTHON_NATIVE" - <<'PY_NATIVE_INVOCATION'
          import json, os, uuid
          from pathlib import Path
          value=json.loads((Path(os.environ['TMPDIR'])/'native-result.json').read_text())
          source=Path(value['output'])
          if source.parent!=Path(os.environ['NATIVE_OUTPUT']).absolute() or str(uuid.UUID(source.name))!=source.name:
              raise SystemExit('BLOCKED: unexpected actual preflight invocation output')
          print(source.name)
          PY_NATIVE_INVOCATION
            )"
            export NATIVE_INVOCATION
            sudo -n env TMPDIR="$TMPDIR" "$PYTHON_NATIVE" tools/ci/check_storage_network_policy.py --output "$NATIVE_OUTPUT" --export-native-preflight "$NATIVE_INVOCATION" --compact-export "$NATIVE_COMPACT_OUTPUT" > "$TMPDIR/native-export.json"
            "$PYTHON_NATIVE" - <<'PY_NATIVE_EXPORT'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          names={'report.json','operations.jsonl','raw.log'}
          receipt=json.loads((Path(os.environ['TMPDIR'])/'native-export.json').read_text())
          root=Path(os.environ['NATIVE_COMPACT_OUTPUT'])
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if set(receipt['files'])!=names or set(p.name for p in root.iterdir())!=names or receipt['invocation']!=os.environ['NATIVE_INVOCATION'] or receipt['source_revision']!=revision or receipt['owner_uid']!=os.getuid() or Path(receipt['destination'])!=root:
              raise SystemExit('BLOCKED: compact handoff identity/name/ownership mismatch')
          for name in names:
              path=root/name;meta=path.lstat()
              if not stat.S_ISREG(meta.st_mode) or meta.st_uid!=os.getuid() or stat.S_IMODE(meta.st_mode)!=0o600 or hashlib.sha256(path.read_bytes()).hexdigest()!=receipt['files'][name]:
                  raise SystemExit('BLOCKED: compact file is not actual runner-readable matched bytes')
          print('Actual runner read all exact compact bytes; hashes/source/owner match. Private traces remain unexported.')
          PY_NATIVE_EXPORT
            exit "$PREFLIGHT_STATUS"
          else
            "$PYTHON_NATIVE" tools/ci/check_storage_network_policy.py --native-preflight --acquisition-scope github-hosted-disposable-readiness --target "$NATIVE_TARGET" --output "$NATIVE_OUTPUT"
          fi
      - name: Retain only compact actual native readiness observations
        if: always() && steps.owned_paths.outcome == 'success' && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-readiness-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.NATIVE_OUTPUT }}/*/report.json
            ${{ env.NATIVE_OUTPUT }}/*/operations.jsonl
            ${{ env.NATIVE_OUTPUT }}/*/raw.log
      - name: Retain only verified runner-owned Mac compact handoff
        if: always() && steps.owned_paths.outcome == 'success' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-readiness-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ env.NATIVE_COMPACT_OUTPUT }}/report.json
            ${{ env.NATIVE_COMPACT_OUTPUT }}/operations.jsonl
            ${{ env.NATIVE_COMPACT_OUTPUT }}/raw.log
