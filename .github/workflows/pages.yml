name: Pages

# GitHub Pages site (job 004-github-pages-site): builds the plugin-free Jekyll
# tree under site/ with the official Pages builder and deploys it.
#   - additive: this is the only new workflow; no existing workflow changes
#   - secretless: rides the GitHub-provided token with pinned permissions
#   - fail-visible: link and contrast gates run BEFORE any artifact upload,
#     so a bad build never deploys
# Pages must be enabled with the "GitHub Actions" source by the owner before
# the first deploy succeeds (RISK-001 runbook in the job's release.md).

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Exactly the Pages permission triple (REQ-009); no secrets context anywhere.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs deploy the latest main (official
# Pages pattern — same shape as release.yml's serialized group).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No later step performs git operations (build, gates, upload all run
      # over the checked-out tree) — keep the token out of the runner's
      # .git/config for the job's lifetime (FIND-SEC-001).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # Exact builder pin (FIND-PLATFORM-001): v1.0.13 is the same commit the
      # floating v1 tag pointed at and the exact image site/tools/build.sh
      # pins — a future v1.x release can no longer change the CI builder
      # while local parity stays frozen (DEC-P01).
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./site
          destination: ./site/_site
      - name: Link gate (zero wrong-root hits, payload budget, diagram-count claims)
        run: python3 site/tools/check-links.py site/_site --base /engram/
      - name: Contrast gate (WCAG AA on both polarities, negative selftest first)
        run: python3 site/tools/check-contrast.py --selftest && python3 site/tools/check-contrast.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
